services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: aligna-backend:dev

    container_name: aligna-backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
