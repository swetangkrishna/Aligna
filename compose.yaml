services:
  postgres:
    image: postgres:17-alpine
    container_name: aligna-postgres

    environment:
      POSTGRES_DB: aligna
      POSTGRES_USER: aligna
      POSTGRES_PASSWORD: aligna_dev_password

    volumes:
      - aligna_postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U aligna -d aligna"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: aligna-backend:dev
    container_name: aligna-backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  aligna_postgres_data: